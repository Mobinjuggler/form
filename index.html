<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال رزومه | دعوت به همکاری</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffc107;
            font-size: 20px;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #252525;
            color: #fff;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 7px;
            cursor: pointer;
        }
        input:focus {
            border-color: #ffc107;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ffc107;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #e0a800;
        }
        #success-message {
            display: none;
            text-align: center;
            background: #1e3d2f;
            color: #28a745;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #28a745;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تکمیل فرم همکاری</h2>
    <p class="subtitle">لطفاً مشخصات و رزومه خود را ارسال کنید</p>

    <form id="resumeForm" action="https://formspree.io/f/mgaaaevd" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="fullname">نام و نام خانوادگی:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="مثال: سارا ترکان">
        </div>

        <div class="form-group">
            <label for="age">سن:</label>
            <input type="number" id="age" name="age" required placeholder="مثال: ۲۲">
        </div>

        <div class="form-group">
            <label for="phone">شماره تماس:</label>
            <input type="tel" id="phone" name="phone" required placeholder="مثال: 09123456789">
        </div>

        <div class="form-group">
            <label for="instagram">آیدی اینستاگرام:</label>
            <input type="text" id="instagram" name="instagram" required placeholder="مثال: username@">
        </div>

        <div class="form-group">
            <label for="resume">فایل رزومه (PDF یا Text):</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.txt,.doc,.docx" required>
        </div>

        <button type="submit" id="submitBtn">ارسال رزومه</button>
    </form>

    <div id="success-message">
        رزومه شما با موفقیت ارسال شد. با شما تماس حاصل می‌شود!
    </div>
</div>

<script>
    const form = document.getElementById('resumeForm');
    const successMsg = document.getElementById('success-message');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'در حال ارسال...';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                form.style.display = 'none';
                successMsg.style.display = 'block';
            } else {
                alert('خطایی در ارسال رخ داد. لطفاً دوباره تلاش کنید.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'ارسال رزومه';
            }
        } catch (error) {
            alert('خطا در اتصال به سرور.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'ارسال رزومه';
        }
    });
</script>

</body>
</html>
